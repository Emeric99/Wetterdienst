<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrierung</title>
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .gruppe {
            margin-bottom: 15px;
        }
        .gruppe label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .control {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded',
(event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const emailError = urlParams.get('emailError');
            const usernameError = urlParams.get('usernameError');

            if (emailError) {
                document.getElementById('emailError').textContent = emailError;
            }
            if (usernameError) {
                document.getElementById('usernameError').textContent = usernameError;
            }

            // Vorbelegung der Felder, falls Werte übergeben wurden
            const email = urlParams.get('email');
            const benutzername = urlParams.get('benutzername');
            const adresse = urlParams.get('adresse');
            const postleitzahl = urlParams.get('postleitzahl');
            const stadt = urlParams.get('stadt');

            if (email) document.getElementById('email').value = email;
            if (benutzername) document.getElementById('benutzername').value = benutzername;
            if (adresse) document.getElementById('adresse').value = adresse;
            if (postleitzahl) document.getElementById('postleitzahl').value = postleitzahl;
            if (stadt) document.getElementById('stadt').value = stadt;
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Registrierung</h1>
        <form action="register" method="post">
            <div class="gruppe">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" class="control" placeholder="name@example.com" required>
                <span id="emailError" class="error"></span>
            </div>
            <div class="gruppe">
                <label for="passwort">Passwort:</label>
                <input type="password" id="passwort" name="passwort" class="control" required>
            </div>
            <div class="gruppe">
                <label for="benutzername">Benutzername:</label>
                <input type="text" id="benutzername" name="benutzername" class="control" required>
                <span id="usernameError" class="error"></span>
            </div>
            <div class="gruppe">
                <label for="adresse">Adresse:</label>
                <input type="text" id="adresse" name="adresse" class="control">
            </div>
            <div class="gruppe">
                <label for="postleitzahl">Postleitzahl:</label>
                <input type="text" id="postleitzahl" name="postleitzahl" class="control">
            </div>
            <div class="gruppe">
                <label for="stadt">Stadt:</label>
                <input type="text" id="stadt" name="stadt" class="control">
            </div>
            <div class="gruppe">
                <input type="submit" value="Registrieren" class="btn">
            </div>
        </form>
    </div>
</body>
</html>
